<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cindy_atieno_ogutu ~ advanced_terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght400;500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0714;
            color: #a3e635;
            font-family: 'Fira Code', monospace;
            padding: 20px;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .terminal-window {
            width: 100%;
            max-width: 900px;
            background-color: #160e22;
            border: 2px solid #6b21a8;
            border-radius: 8px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 15px rgba(107, 33, 168, 0.2);
            overflow: hidden;
        }

        .terminal-header {
            background-color: #241435;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 2px solid #6b21a8;
            position: relative;
        }

        .window-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .btn-close { background-color: #ef4444; }
        .btn-minimize { background-color: #eab308; }
        .btn-maximize { background-color: #22c55e; }

        .window-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: #c084fc;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .terminal-body {
            padding: 24px;
            font-size: 1rem;
            height: 550px;
            overflow-y: auto;
        }

        .prompt-line {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            margin-bottom: 4px;
        }

        .user-host {
            color: #c084fc;
            font-weight: bold;
        }

        .command {
            color: #f8fafc;
            font-weight: 500;
        }

        .output-block {
            color: #cbd5e1;
            padding-left: 4px;
            margin-bottom: 16px;
        }

        .output-highlight {
            color: #a3e635;
            font-weight: bold;
        }

        .ascii-art {
            color: #d8b4fe;
            white-space: pre;
            font-size: 0.85rem;
            line-height: 1.2;
            margin-bottom: 24px;
            overflow-x: auto;
        }

        .input-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }

        .terminal-input {
            background: transparent;
            border: none;
            color: #f8fafc;
            font-family: 'Fira Code', monospace;
            font-size: 1rem;
            flex: 1;
            outline: none;
        }

        .help-grid {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 4px;
            margin-top: 8px;
        }

        .help-cmd {
            color: #e879f9;
            font-weight: bold;
        }

        /* Easter Egg Animations */
        .steam-line {
            display: inline-block;
            animation: floatUp 2s infinite ease-in-out;
            color: #c084fc;
        }
        .steam-2 { animation-delay: 0.4s; }
        .steam-3 { animation-delay: 0.8s; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10px) scale(1.2); opacity: 0; }
        }

        .matrix-rain {
            color: #a3e635;
            animation: matrixFade 1.5s infinite linear;
            white-space: pre;
        }

        @keyframes matrixFade {
            0% { opacity: 0.3; text-shadow: 0 0 0px #a3e635; }
            50% { opacity: 1; text-shadow: 0 0 8px #a3e635; }
            100% { opacity: 0.3; text-shadow: 0 0 0px #a3e635; }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #160e22;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a1d96;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="terminal-window" onclick="document.getElementById('cli-input').focus()">
    <div class="terminal-header">
        <div class="window-buttons">
            <span class="btn btn-close"></span>
            <span class="btn btn-minimize"></span>
            <span class="btn btn-maximize"></span>
        </div>
        <div class="window-title">cindy@atieno:~</div>
    </div>
    
    <div class="terminal-body" id="terminal-history">
        <div class="ascii-art">
   ____ _____ _   _ ______     __
  / ___|_   _| | | |  _ \ \   / /
 | |     | | | |_| | | | \ \ / / 
 | |___  | | |  _  | |_| |\ V /  
  \____| |_| |_| |_|____/  |_|   
        </div>

        <div class="output-block">
            <p>Welcome back, explorer.</p>
            <p>Type <span class="output-highlight">help</span> to explore my stack, background, and secret modes.</p>
        </div>

        <div id="logs"></div>

        <div class="input-container">
            <span class="user-host">guest@sf-terminal:~$</span>
            <input type="text" id="cli-input" class="terminal-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>
</div>

<script>
    // Pools of answers to keep cycles fresh and informative
    const responses = {
        whoami: [
            "I am <span class='output-highlight'>Cindy Atieno Ogutu</span>. I build resilient backend systems and dynamic client-side applications. I care about systems that don't crack under load.",
            "That's me! Cindy. Currently deep in system modeling, distributed architectures, and designing frontends that speak to real-world context.",
            "Cindy here. I spend my days orchestrating environments where clean code, system dependability metrics, and human creativity meet."
        ],
        stack: [
            "My workflow is grounded in <span class='output-highlight'>Linux (Ubuntu)</span>, automated with shell scripting, and built using TypeScript, JavaScript, and React.",
            "Frontend and DevOps engineering drive my practical stack. I use React on the interface layer and depend heavily on structural shell scripting underneath.",
            "I build architectures targeting the AWS Well-Architected Framework guidelines, choosing tools that maximize reliability over code complexity."
        ],
        systems: [
            "I have a deep focus on distributed systems theory. I study leader election, failure detection topologies, and consensus engines like Paxos.",
            "Currently analyzing system availability patterns, discrete-event queue simulations, and network performance thresholds under stress.",
            "I enjoy tracing failure boundaries—how data moves safely across networks when nodes go down or lag unexpectedly."
        ],
        creative: [
            "When the terminal closes, I write poetry and narratives under the alias <span class='output-highlight'>Captain Bliss</span> over on Substack.",
            "My writing space as Captain Bliss explores complex human mechanics and abstract philosophies through poetry.",
            "Storytelling balances out my technical architecture. Creative writing offers an abstract blueprint distinct from system design."
        ],
        fact: [
            "Fun Fact: I once built a web-based audio platform using the native Web Audio API just to map out dynamic sound routing parameters!",
            "Fun Fact: I prefer a full Linux ecosystem. Bash scripting isn't just an option for automating tasks; it's practically my morning coffee.",
            "Fun Fact: I once wrote a complex literature review for a digital mentorship tracking engine aimed at helping low-resource urban communities."
        ]
    };

    // Tracks index offsets for alternating responses
    const counters = { whoami: 0, stack: 0, systems: 0, creative: 0, fact: 0 };

    const inputField = document.getElementById('cli-input');
    const logsContainer = document.getElementById('logs');
    const historyWindow = document.getElementById('terminal-history');

    inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const rawInput = inputField.value;
            const cmd = rawInput.trim().toLowerCase();
            
            if (cmd.length === 0) return;

            createLogEntry(rawInput, true);

            if (responses[cmd] !== undefined) {
                // Fetch alternating response from the specific category array
                const index = counters[cmd] % responses[cmd].length;
                createLogEntry(responses[cmd][index]);
                counters[cmd]++;
            } else {
                switch(cmd) {
                    case 'help':
                        showHelp();
                        break;
                    case 'clear':
                        logsContainer.innerHTML = '';
                        break;
                    case 'coffee':
                        triggerCoffee();
                        break;
                    case 'blisstime':
                        triggerBlisstime();
                        break;
                    default:
                        createLogEntry(`Unknown command: '${rawInput}'. Try typing <span class="output-highlight">help</span> or <span class="output-highlight">fact</span>.`);
                }
            }

            inputField.value = '';
            historyWindow.scrollTop = historyWindow.scrollHeight;
        }
    });

    function createLogEntry(text, isCommand = false) {
        const div = document.createElement('div');
        if (isCommand) {
            div.className = 'prompt-line';
            div.innerHTML = `<span class="user-host">guest@sf-terminal:~$</span><span class="command">${text}</span>`;
        } else {
            div.className = 'output-block';
            div.innerHTML = text.startsWith('<') ? text : `<p>${text}</p>`;
        }
        logsContainer.appendChild(div);
    }

    function showHelp() {
        const helpText = `
            <p>Run these commands for dynamic facts and details:</p>
            <div class="help-grid">
                <span class="help-cmd">whoami</span><span class="info-val">Bio profiles (changes each run)</span>
                <span class="help-cmd">stack</span><span class="info-val">Tech infrastructure and tooling specs</span>
                <span class="help-cmd">systems</span><span class="info-val">Distributed environments deep dive</span>
                <span class="help-cmd">creative</span><span class="info-val">Explore my Captain Bliss writing identity</span>
                <span class="help-cmd">fact</span><span class="info-val">Uncover a random piece of trivia about me</span>
                <span class="help-cmd">coffee</span><span class="info-val">Initiate fuel synthesis mode</span>
                <span class="help-cmd">blisstime</span><span class="info-val">Launch the creative narrative screen stream</span>
                <span class="help-cmd">clear</span><span class="info-val">Wipe screen terminal history buffer</span>
            </div>
        `;
        createLogEntry(helpText);
    }

    function triggerCoffee() {
        const coffeeArt = `
          <span class="steam-line">~</span>  <span class="steam-line steam-2">~</span>  <span class="steam-line steam-3">~</span>
         |___________| )
          \\         / /
           \\_______/ /
            _______
           |_______|
           <p style="margin-top:10px; color:#c084fc;">[SUCCESS] Coffee framework active. Caffeine injected into terminal loop.</p>
        `;
        createLogEntry(coffeeArt);
    }

    function triggerBlisstime() {
        const matrixArt = `
        <div class="matrix-rain">
        B L I S S T I M E
        ⚓ ✦ ⚙ ⚡ 🌊 ✦ ⚓
        Poetry stream synchronized...
        Words compiling into the system buffer.
        </div>
        `;
        createLogEntry(matrixArt);
    }
</script>

</body>
</html>
